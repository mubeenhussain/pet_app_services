name: pet_app
description: Pet Services Mobile Application — Saudi Arabia (BRD v1)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  cloud_functions: ^5.3.5
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

  dio: ^5.8.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  geocoding: ^4.0.0

  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  intl: ^0.20.2

  image_picker: ^1.1.2
  equatable: ^2.0.7
  uuid: ^4.5.1
  logger: ^2.5.0
  google_sign_in: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/system/
    - assets/icons/pets/
    - assets/icons/services/
